<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us-White Water Rafting</title>
    <meta name="description"
      content="This web page provides the contact information and location details of the company to the users .">
    <meta name="author" content="Samuel Gyebi Yeboah">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <div class="flex">
            <img src="images/z-wwr-logo.jpg" alt="wwr logo">
        </div>
        <nav>
            <ul class="navigation">
                <li><a href="https://jhunearh.github.io/wdd130/index.html">Home</a></li>
                <li><a href="https://jhunearh.github.io/wdd130/wwr/about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1><strong>White Water Rafting Company</strong></h1>
        <section class="contact">
            <h2>Contact Us</h2>

            <p>
                <strong>Address: </strong>
                123 Main Street, Accra, Ghana
            </p>
            <p>
                <strong>Phone: </strong>
                +233 20 123 4567
            </p>
            <p>
                <strong>Email: </strong>
                info@whitewater.com
            </p>
        </section>


        <div class="contact-layout">
            <section class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d15884.60030696104!2d-0.223882!3d5.544754!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sgh!4v1791457818333!5m2!1sen!2sgh"
                  width="400" height="420" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>

            <section class="form">
                <form>

                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="John Doe"
                      required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="123@example.com"
                      required>

                    <p>Message Purpose</p>
                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general">
                        General Purpose
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"
                      rows="4"></textarea>

                    <label for="subscription">
                        <input type="checkbox" id="subscription" name="subscription">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </section>

        </div>

        <section class="employees">
            <h2>We Are Here To Serve You</h2>
            <figure>
                <img src="images/employee1.jpg" alt="employee1 profile">
                <figcaption>John Asamoah - Operations Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="employee2 profile">
                <figcaption>Sarah Serwaa - Lead Rafting Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="employee3 profile">
                <figcaption>David Owusu - Customer Service Manager</figcaption>
            </figure>
        </section>


    </main>
    <footer>
        <p>© 2026 | White Water Rafting | Samuel Gyebi Yeboah</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook Icon">
            </a>
            <a href="https://linkedIn.com">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
