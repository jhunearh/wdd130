<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="Viewpoint" content="width=device-width" , initial-scale=1.0>
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>Poll-Form</title>
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>

            <div class="contact">
                <!-- <legend>Contact Information</legend> -->

                <label for="fullname">Full Name: <input type="text" id="fullname" name="fullname"
                      required></label>

                <label for="useremail">Email: <input type="email" id="useremail" name="useremail"
                      required></label>

            </div>


            <div class="question">
                <!-- <legend>Questions</legend> -->


                <label for="browser">What is your favorite browser? <select name="browser"
                      id="browser">
                        <option value="0" selected disabled>Choose one...</option>
                        <option value="1">Chrome</option>
                        <option value="2">Firefox</option>
                        <option value="3">Explorer</option>
                        <option value="4">Other</option>
                    </select></label>


                <label for="pet">Do you have a household pet? <input type="checkbox" id="pet"
                      name="pet"></label>


                <label for="feedback">List the places you have lived.</label>
                <textarea id="feedback" name="feedback" rows="4"
                  placeholder="Koforidua Eastern, Accra Greater Accra, Kumasi Ashanti,"></textarea>

            </div>

            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>©2026 | HTML Form - User Poll Activity | Samuel Gyebi Yeboah</p>
    </footer>
</body>

</html>
